name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug + release APKs
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: elco-remote-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Stable public link (no login needed), handy for downloading straight onto the TV:
      # https://github.com/<owner>/<repo>/releases/latest/download/ElcoRemote.apk
      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk ElcoRemote.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ElcoRemote.apk --target "${{ github.sha }}" \
            --title "Latest build" --notes "Built from ${{ github.sha }}" --latest
